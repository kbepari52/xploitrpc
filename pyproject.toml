[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xploitrpc"
version = "2.0.0"
description = "WordPress XML-RPC attack surface toolkit for authorized penetration testing"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Krishanu Bepari", email = "kbepari52@users.noreply.github.com" }]
keywords = ["wordpress", "xmlrpc", "pentest", "security", "recon"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
xploitrpc = "xrpc.cli:main"

[project.urls]
Homepage = "https://github.com/kbepari52"

[tool.setuptools]
packages = ["xrpc"]
